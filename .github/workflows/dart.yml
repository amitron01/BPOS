name: Flutter iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      # 1️⃣ কোড Checkout
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Flutter setup
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'

      # 3️⃣ Flutter dependencies install
      - name: Install dependencies
        run: flutter pub get

      # 4️⃣ CocoaPods install
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      # 5️⃣ Podfile fix (Swift module & non-modular headers)
      - name: Fix Podfile for CI
        run: |
          cd ios
          sed -i '' "/post_install do |installer|/,/end/d" Podfile || true
          echo "post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'arm64'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['DEFINES_MODULE'] = 'YES'
                config.build_settings['SWIFT_VERSION'] = '5.0'
              end
            end
          end" >> Podfile

      # 6️⃣ Install iOS Pods
      - name: Install iOS Pods
        run: |
          cd ios
          pod install --repo-update

      # 7️⃣ Build iOS app (release, no codesign)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign
