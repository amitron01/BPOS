name: Flutter iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # v4 লেটেস্ট এবং দ্রুত

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1' # আপনার পিসির ফ্লাটার ভার্সনটি এখানে দিলে ভালো হয় (৩.৩৮.৯ সম্ভবত ভুল ভার্সন নম্বর)
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # ৫ নম্বর ধাপটি বাদ দিয়ে সরাসরি এই স্টেপটি ব্যবহার করুন
      - name: Install Pods
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build iOS App
        run: flutter build ios --release --no-codesign
