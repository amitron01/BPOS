name: Flutter iOS CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - MAIN 

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      # ১. কোড চেকআউট
      - name: Checkout repo
        uses: actions/checkout@v4

      # ২. ফ্লটার সেটআপ (ভার্সন ৩.২৭.১ স্ট্যাবল হিসেবে দেওয়া হয়েছে)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ৩. প্যাকেজ ডিপেন্ডেন্সি ইনস্টল
      - name: Install dependencies
        run: flutter pub get

      # ৪. আইওএস পড ইনস্টল (সরাসরি ক্লিন করে ইনস্টল হবে)
      - name: Install iOS Pods
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      # ৫. আইওএস অ্যাপ বিল্ড (Release, No Codesign)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      # ৬. আর্টেফ্যাক্ট আপলোড (বিল্ড শেষে আপনি জিপ ফাইলটি ডাউনলোড করতে পারবেন)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
