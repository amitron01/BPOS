name: Flutter iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      # ১. কোড চেকআউট
      - name: Checkout repo
        uses: actions/checkout@v4

      # ২. ফ্লটার সেটআপ (Stable চ্যানেল ব্যবহার করা হয়েছে যাতে ভার্সন এরর না আসে)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ৩. ডিপেন্ডেন্সি ইনস্টল
      - name: Install dependencies
        run: flutter pub get

      # ৪. পড ফাইল ক্লিন এবং নতুন করে ইনস্টল
      - name: Install iOS Pods
        run: |
          cd ios
          rm -rf Pods Podfile.lock Runner.xcworkspace
          pod install --repo-update
          cd ..

      # ৫. আইওএস অ্যাপ বিল্ড (Release mode)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      # ৬. বিল্ড করা ফাইলটি জিপ করে ডাউনলোডের জন্য প্রস্তুত করা
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPOS-iOS-App
          path: build/ios/iphoneos/Runner.app
